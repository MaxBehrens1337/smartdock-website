name: SMARTDOCK Stage on GitHub Pages
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: smartdock-pages-stage
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Restore verified website snapshot
        if: ${{ hashFiles('dist/index.html') == '' }}
        shell: python
        run: |
          from pathlib import Path
          import hashlib, io, tarfile
          parts = sorted(Path('.').glob('website-part-*'))
          assert len(parts) == 14, f'Incomplete snapshot: {len(parts)} chunks'
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '1945dd21c40518f73c1d16e1541f7da6b6d5193196bcec238bc5163afaefe5b3'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              archive.extractall('.', filter='data')
          print('Website snapshot restored')
      - name: Save website files on staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m 'Import SMARTDOCK Version 7 website files'
            git push origin HEAD:staging
          fi
      - name: Prepare Pages artifact
        shell: python
        run: |
          """Create a Pages artifact; leave the tracked Hetzner-ready dist unchanged."""
          from pathlib import Path
          import re
          import shutil

          base = '/smartdock-website'
          out = Path('_site')
          shutil.copytree('dist', out, dirs_exist_ok=True)
          for path in out.rglob('*'):
              if not path.is_file() or path.suffix not in {'.html', '.js', '.css', '.json'}:
                  continue
              text = path.read_text()
              # Resources need the project prefix, but React Router route definitions do not.
              text = re.sub(r'(?<![\w:/])/(assets|media|hcgi|data)/', base + r'/\1/', text)
              text = text.replace('"/favicon.png"', '"' + base + '/favicon.png"')
              text = text.replace('"/preview.js"', '"' + base + '/preview.js"')
              if path.suffix == '.js':
                  text = re.sub(r'basename:([A-Za-z_$][\w$]*)="/"', r'basename:\1="' + base + '"', text)
                  text = re.sub(r'window\.location\.href=([A-Za-z_$][\w$]*)(?=[,;}])', r'window.location.href=window.__sdPagesUrl(\1)', text)
                  text = text.replace('window.location.href="/"', 'window.location.href="' + base + '/"')
              if path.name == 'positionhold.js':
                  text = text.replace('vA=window.location.origin', 'vA=window.location.origin+"' + base + '"')
              if path.name == 'preview.js':
                  text = text.replace('const match = url.pathname.match(', 'const match = url.pathname.replace("' + base + '", "").match(')
              if path.suffix in {'.html', '.js'}:
                  text = re.sub(r'(href[=:]["\x27])/(?!/|' + re.escape(base[1:]) + r'(?:/|["\x27]))', r'\1' + base + '/', text)
              if path.suffix == '.html':
                  helper = '<script>window.__sdPagesUrl=function(u){if(typeof u!=="string")return u;try{var v=new URL(u,location.href);if(v.origin===location.origin&&!v.pathname.startsWith("' + base + '/")&&v.pathname!=="' + base + '")return "' + base + '"+v.pathname+v.search+v.hash}catch(e){}return u};document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(a){var u=a.getAttribute("href");if(u&&u.startsWith("/")&&!u.startsWith("//"))a.setAttribute("href",window.__sdPagesUrl(u))}},true);</script>'
                  text = text.replace('<head>', '<head>' + helper, 1)
              path.write_text(text)
          (out / '.nojekyll').touch()
          print('Pages artifact ready:', out)
      - name: Verify JavaScript syntax
        run: |
          node --check _site/assets/index-RRVGC1mK.js
          node --check _site/assets/positionhold.js
          node --check _site/preview.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish stage
        id: deployment
        uses: actions/deploy-pages@v4
