          origin = "https://smartdock-testvorschau.adrianjo.chatgpt.site/"
          def fetch(item):
              name, expected = item
              path = pathlib.Path("dist") / name
              if path.exists() and hashlib.sha256(path.read_bytes()).hexdigest() == expected:
                  return
              data = urllib.request.urlopen(origin + quote(name), timeout=90).read()
              if hashlib.sha256(data).hexdigest() != expected:
                  raise RuntimeError("Snapshot mismatch: " + name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(fetch, manifest.items()))
          print("Verified", len(manifest), "website files")
      - name: Save website snapshot on staging
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified SMARTDOCK Version 7 website snapshot'
            git push origin HEAD:staging
          fi
      - name: Prepare project-path-safe Pages artifact
        shell: python
        run: |
          """Create a Pages artifact; leave the tracked Hetzner-ready dist unchanged."""
          from pathlib import Path
          import re
          import shutil

          base = '/smartdock-website'
          out = Path('_site')
          shutil.copytree('dist', out, dirs_exist_ok=True)
          for path in out.rglob('*'):
              if not path.is_file() or path.suffix not in {'.html', '.js', '.css', '.json'}:
                  continue
              text = path.read_text()
              # Resources need the project prefix, but React Router route definitions do not.
              text = re.sub(r'(?<![\w:/])/(assets|media|hcgi|data)/', base + r'/\1/', text)
              text = text.replace('"/favicon.png"', '"' + base + '/favicon.png"')
              text = text.replace('"/preview.js"', '"' + base + '/preview.js"')
              if path.suffix == '.js':
                  text = re.sub(r'basename:([A-Za-z_$][\w$]*)="/"', r'basename:\1="' + base + '"', text)
                  text = re.sub(r'window\.location\.href=([A-Za-z_$][\w$]*)(?=[,;}])', r'window.location.href=window.__sdPagesUrl(\1)', text)
                  text = text.replace('window.location.href="/"', 'window.location.href="' + base + '/"')
              if path.name == 'preview.js':
                  text = text.replace('const match = url.pathname.match(', 'const match = url.pathname.replace("' + base + '", "").match(')
              if path.suffix in {'.html', '.js'}:
                  text = re.sub(r'(href[=:]["\x27])/(?!/|' + re.escape(base[1:]) + r'(?:/|["\x27]))', r'\1' + base + '/', text)
              if path.suffix == '.html':
                  helper = '<script>window.__sdPagesUrl=function(u){return typeof u==="string"&&u.startsWith("/")&&!u.startsWith("//")&&!u.startsWith("' + base + '/")?"' + base + '"+u:u};</script>'
                  text = text.replace('<head>', '<head>' + helper, 1)
              path.write_text(text)
          (out / '.nojekyll').touch()
          print('Pages artifact ready:', out)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish stage
        id: deployment
        uses: actions/deploy-pages@v4

